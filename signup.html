<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta http-equiv="Cache-Control" content="no-cache"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="판다마켓" />
  <meta property="og:url" content="https://codeit-sprint-mission-seony-y.netlify.app/signup" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="일상의 모든 물건을 거래해보세요"/>
  <meta property="og:image" content="https://codeit-sprint-mission-seony-y.netlify.app/images/logo/og-image.png" />
  <title>회원가입하기</title>
  <link rel="shortcut icon" type="image/x-icon" href="images/logo/favicon.ico">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/form_common.css">
  <link rel="stylesheet" href="css/signup.css">
  <script src="scripts/auth.js"></script>
</head>
<body>
  <div class="auth_container">
    <a href="/" id="signup_logo">
      <img src="images/logo/panda-market-logo.png" alt="판다마켓 홈페이지">
    </a>
    <form id="signup_form" method="post">
      <div class="input_box">
      <label for="email">이메일</label>
        <div class="input-wrapper">  
          <input id="email" type="email" name="email" placeholder="이메일을 입력해주세요" required/>
          <span id="emailError" class="error-message"></span>
        </div>
      </div>
      <div class="input_box">
      <label for="nickname">닉네임</label>
       <div class="input-wrapper">  
        <input id="nickname" type="text" name="nickname" placeholder="닉네임을 입력해주세요" required/>
        <span id="nicknameError" class="error-message"></span>
      </div>
      </div>
      <div class="input_box">
        <label for="password">비밀번호</label>
        <div class="input-wrapper">
          <input id="password" type="password" name="password" placeholder="비밀번호를 입력해주세요" required/>
            <botton type="button" class="password-toggle-button" aria-label="비밀번호 표시/숨기기">
              <img class="password-toggle-img" src="images/input/invisible_input.svg" alt="비밀번호 숨기기"/>
            </botton>
            <span id="passwordError" class="error-message"></span>
        </div>
      </div>
      <div class="input_box">
        <label for="confirm_password">비밀번호 확인</label>
        <div class="input-wrapper">
          <input id="confirm_password" type="password" name="confirm_password" placeholder="비밀번호를 입력해주세요" required/>
          <botton type="button" class="password-toggle-button" aria-label="비밀번호 표시/숨기기">
            <img class="password-toggle-img" src="images/input/invisible_input.svg" alt="비밀번호 숨기기"/>
          </botton>
            <span id="passwordConfirmationError" class="error-message"></span>
        </div>
      </div>
      <button type="submit" class="button submitBtn" disabled>회원가입</button>
    </form>
    <div id="quicklogin_container">
      <p class="quickLogin_title">간편 로그인하기</p>
      <div class="quicklogin_btn_area">
        <a href="https://www.google.com/" target="_blank">
          <img src="images/sns/google-icon.png" alt="구글 로그인">
        </a>
        <a href="https://www.kakaocorp.com/page/" target="_blank">
          <img src="images/sns/kakao-icon.png" alt="카카오톡 로그인">
        </a>
      </div>
    </div>
    <p id="navigateToLogin">
      이미 회원이신가요?
      <a href="login.html">로그인</a>
    </p>
  </div>
  </div>
</body>
</html>
